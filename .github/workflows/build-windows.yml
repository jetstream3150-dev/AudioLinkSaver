name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt
      - name: Check syntax
        run: python -m py_compile app.py build_windows.py
      - name: Build EXE
        run: python build_windows.py
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/AudioLinkSaver.exe" -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "App exited unexpectedly: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Checksum
        shell: pwsh
        run: Get-FileHash dist/AudioLinkSaver.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: AudioLinkSaver-Windows-EXE
          path: dist/AudioLinkSaver.exe
          if-no-files-found: error
